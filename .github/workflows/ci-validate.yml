# ci-validate — THE ONE lightweight content validation path (Simple Production Mode).
# This is the ONLY workflow a normal 2-article content publish has to pay for:
#   matrix assemble + scoped consistency + grounding of the CHANGED article ids
#   (derived from the push diff — never a full historical audit) + deterministic
#   build + draft-leak guard. NO test-suite, NO capacity-check, NO editorial
#   audit, NO soak — those are engine-change gates (factory-validate /
#   factory-capacity-validate / factory-soak, all path-filtered) or DEEP/FULL
#   operator scopes. Pages is served from branch main / (root); this workflow
#   never touches Pages: no pages/id-token permissions, no artifacts.
name: ci-validate
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble matrix + status
        run: node scripts/factory/factory.js status
      - name: Consistency check (uniques, published files, no draft leak)
        run: node scripts/factory/factory.js consistency
      - name: Grounding check — ONLY the article ids changed by this push
        run: |
          set -eu
          CHANGED_IDS=$( (git diff --name-only HEAD~1 HEAD -- data/published/ 2>/dev/null || true) \
            | sed -n 's#^data/published/\(A[0-9]\{5\}\)\.html$#\1#p' | sort -u | paste -sd, - )
          if [ -n "$CHANGED_IDS" ]; then
            echo "grounding scope (changed articles): $CHANGED_IDS"
            node scripts/factory/factory.js grounding $CHANGED_IDS
          else
            echo "no changed article archives in this push — grounding scope empty (light content path)"
          fi
      - name: Build (regenerates site/ and idempotently promotes public outputs to root)
        run: node scripts/site/build-site.js
      - name: Build phải deterministic — working tree phải SẠCH (no drift)
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: build/site sinh khác biệt so với trạng thái đã commit — build không deterministic hoặc outputs bị bỏ sót."
            git status --porcelain
            exit 1
          fi
          echo "OK: deterministic build — không drift."
      - name: Draft boundary — Jekyll exclusion (không .nojekyll; _drafts chỉ A#####; không draft trong public outputs)
        run: |
          set -eu
          # Pages chạy Jekyll (KHÔNG .nojekyll) nên thư mục gạch dưới `_drafts/`
          # không bao giờ được phục vụ công khai — draft được commit cho push-driven loop.
          test ! -f .nojekyll || { echo "FAIL: .nojekyll tồn tại ở root — Pages sẽ phục vụ _drafts/ công khai (Jekyll exclusion bị tắt)"; exit 1; }
          if [ -d _drafts ]; then
            bad=$(find _drafts -maxdepth 1 -type f | grep -Ev '^_drafts/A[0-9]{5}(\.body)?\.html$' | head -5 || true)
            [ -z "$bad" ] || { echo "FAIL: file lạ trong _drafts (chỉ cho phép A#####.html / A#####.body.html): $bad"; exit 1; }
          fi
          if find . -name "*.body.html" -not -path "./.git/*" -not -path "./_drafts/*" | grep -q .; then
            echo "FAIL: draft body (.body.html) nằm ngoài _drafts — nằm trong cây public"
            exit 1
          fi
          if jq -e '.files | any(contains("_drafts"))' data/state/build-manifest.json >/dev/null 2>&1; then
            echo "FAIL: build-manifest chứa đường dẫn _drafts"
            exit 1
          fi
          echo "OK: Jekyll exclusion active — draft được commit nhưng không bao giờ public."
