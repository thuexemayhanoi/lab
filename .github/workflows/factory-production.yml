name: Factory production

# ĐƯỜNG SẢN XUẤT DUY NHẤT của /lab — PUSH-DRIVEN (mô hình /vanchinh + /blog,
# docs/PROC-PUBLISH.md): writer ngoài (Mistral) chỉ cần commit/push CẶP BÀI
# (2 bài, theo chunk_size trong data/state/production-control.json) vào
# _drafts/ rồi workflow TỰ động hoàn tất vòng sản xuất:
#
#   writer : chọn cặp kế tiếp (next_claimable_id) → research packet
#            data/research/<ID>.json → viết body _drafts/<ID>.body.html →
#            node scripts/factory/wrap-drafts.js → commit _drafts/ + packets
#            → PUSH
#   workflow (kênh này):
#     1. push-selection.js chọn EXACT ID từ diff _drafts/ vừa push
#        (mode new/repair/skip/paused; REFUSE exit 3: ID lạ, PUBLISHED/BLOCKED,
#        mixed new+repair, > chunk_size, body-only, thiếu research packet —
#        KHÔNG có gì được claim/QA/publish khi REFUSE)
#     2. recover (transaction treo / lock không rõ ownership = STOP —
#        KHÔNG force-unlock, KHÔNG force-clear)
#     3. prepare-next --ids — claim EXACT ID vừa push, KHÔNG claim hàng
#        PLANNED khác, KHÔNG chạm bài PUBLISHED
#     4. research các row RESEARCH (packet đã được push cùng draft)
#     5. qa --ids --scope fast (ngưỡng 75/70 KHÔNG đổi)
#     6. publish --ids — CHỈ hàng PASS, atomic stage → build → staged
#        verify → commit (publish gate/QA evidence/grounding giữ nguyên)
#     7. light smoke: scoped consistency + liveness watchdog (0/WARN OK) —
#        KHÔNG full verify, KHÔNG soak (đó là việc của factory-validate.yml
#        và factory-soak.yml path-filtered)
#     8. commit + push fast-forward MỘT LẦN (final-tree verify; rebase
#        phải verify lại; KHÔNG force push)
#
# Writer sửa draft REPAIR: chỉ cần sửa _drafts/<ID>.body.html → wrap → push
# lại (repair push: QA/publish EXACT ID đó, không claim việc mới).
#
# DRAFT BOUNDARY (push-driven): _drafts/ được COMMIT để Actions đọc được,
# nhưng GitHub Pages chạy Jekyll và Jekyll KHÔNG BAO GIỜ publish thư mục
# underscore (_drafts/) → draft không bao giờ công khai (.nojekyll đã xóa;
# factory.js consistency + capacity-check.js kiểm tra hợp đồng này).
#
# Commit publish của workflow (draft biến mất — diff D-only) có thể trigger
# lại workflow qua paths _drafts/**; lần đó push-selection trả mode=skip →
# workflow exit 0 sạch, KHÔNG vòng lặp.
#
# workflow_dispatch chỉ còn op BẢO TRÌ (read-only ngoài recover):
#   status      — in trạng thái engine
#   recover     — recover transaction/lock treo (FAIL-CLOSED)
#   diagnostics — consistency + liveness watchdog (read-only)
#
# HỢP ĐỒNG PUSH: commit rồi push fast-forward; origin đổi giữa chừng →
# fetch + rebase; sau rebase PHẢI verify lại PASS trước khi push lại;
# conflict/verify FAIL = STOP, KHÔNG force push, KHÔNG replay; thử tối đa
# 2 lần; FINAL_PUSHED_HEAD/ORIGIN_HEAD_AFTER in ra để báo cáo đúng head.

on:
  push:
    branches: [main]
    paths: ['_drafts/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'status | recover | diagnostics'
        required: true
        type: string

concurrency:
  group: lab-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  operate:
    if: github.repository == 'thuexemayhanoi/lab'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action || 'push' }}
    steps:
      - name: Checkout (fetch-depth 2 để đọc diff HEAD~1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra input hợp lệ
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          case "$ACTION" in
            status|recover|diagnostics) ;;
            *) echo "::error::action không hỗ trợ: $ACTION (chỉ status|recover|diagnostics)"; exit 1 ;;
          esac
          echo "action=$ACTION"

      - name: Chọn phạm vi push (EXACT ID từ file _drafts vừa push)
        id: select
        if: github.event_name == 'push'
        run: |
          set -eu -o pipefail
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- _drafts/ > /tmp/added.txt || true
          git diff --name-only --diff-filter=M HEAD~1 HEAD -- _drafts/ > /tmp/modified.txt || true
          echo "drafts added: $(wc -l < /tmp/added.txt || echo 0), modified: $(wc -l < /tmp/modified.txt || echo 0)"
          code=0
          node scripts/factory/push-selection.js --added /tmp/added.txt --modified /tmp/modified.txt | tee /tmp/selection.json || code=$?
          if [ "$code" = "3" ]; then
            echo "::error::push REFUSED (draft vi phạm hợp đồng — xem log push-selection ở trên). KHÔNG có gì được claim/QA/publish/mutate."
            exit 3
          fi
          if [ "$code" != "0" ]; then
            echo "::error::push-selection FAIL (exit $code)"
            exit "$code"
          fi
          node <<'EOF'
          const fs = require('fs');
          const sel = JSON.parse(fs.readFileSync('/tmp/selection.json', 'utf8').split('\n')[0]);
          const outs = [
            'proceed=' + String(sel.proceed).toLowerCase(),
            'mode=' + sel.mode,
            'claim_ids=' + sel.claim_ids.join(','),
            'qa_ids=' + sel.qa_ids.join(','),
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, outs.join('\n') + '\n');
          const label = sel.mode === 'skip' ? 'skip-noop'
            : 'push-' + sel.mode + '-' + (sel.claim_ids.concat(sel.qa_ids).join(',') || 'none');
          fs.appendFileSync(process.env.GITHUB_ENV, 'COMMIT_LABEL=' + label + '\n');
          console.log('selection: mode=' + sel.mode + ' claim=' + sel.claim_ids.join(',') + ' qa=' + sel.qa_ids.join(','));
          if (sel.mode === 'paused') {
            console.log('production-control: enabled=false — DỪNG SẠCH trước khi claim (không QA/publish lần này).');
          }
          EOF

      - name: Recover transaction nếu treo (trước mọi op mutating)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          node scripts/factory/operator.js recover

      - name: Claim EXACT ID vừa push (KHÔNG claim hàng PLANNED khác)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.claim_ids != ''
        run: |
          set -eu
          node scripts/factory/operator.js prepare-next --ids "${{ steps.select.outputs.claim_ids }}" --scope fast

      - name: Research các row RESEARCH trong scope (packet đã push cùng draft)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        env:
          QA_IDS: ${{ steps.select.outputs.qa_ids }}
        run: |
          set -eu
          RESEARCH_IDS=$(node <<'EOF'
          const fs = require('fs');
          const dir = 'data';
          const parts = fs.readdirSync(dir).filter(f => /^content-matrix\.csv\.part/.test(f)).sort();
          let text = parts.length ? parts.map(p => fs.readFileSync(dir + '/' + p, 'utf8')).join('') : '';
          if (!text) text = fs.readFileSync('data/content-matrix.csv', 'utf8');
          const lines = text.split('\n');
          const H = lines[0].split(',');
          const iI = H.indexOf('article_id'), sI = H.indexOf('status');
          const want = new Set((process.env.QA_IDS || '').split(',').filter(Boolean));
          const ids = [];
          for (const l of lines.slice(1)) { if (!l.trim()) continue; const c = l.split(','); if (want.has(c[iI]) && c[sI] === 'RESEARCH') ids.push(c[iI]); }
          console.log(ids.join(','));
          EOF
          )
          if [ -n "$RESEARCH_IDS" ]; then
            node scripts/factory/operator.js research --ids "$RESEARCH_IDS" --scope fast
          else
            echo "không có row RESEARCH trong scope (repair push hoặc đã research xong)"
          fi

      - name: op qa (ngưỡng 75/70 KHÔNG đổi)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        run: |
          set -eu
          node scripts/factory/operator.js qa --ids "${{ steps.select.outputs.qa_ids }}" --scope fast

      - name: op publish (CHỈ hàng PASS, atomic stage → build → staged verify → commit)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        env:
          QA_IDS: ${{ steps.select.outputs.qa_ids }}
        run: |
          set -eu
          PASS_IDS=$(node <<'EOF'
          const fs = require('fs');
          const dir = 'data';
          const parts = fs.readdirSync(dir).filter(f => /^content-matrix\.csv\.part/.test(f)).sort();
          let text = parts.length ? parts.map(p => fs.readFileSync(dir + '/' + p, 'utf8')).join('') : '';
          if (!text) text = fs.readFileSync('data/content-matrix.csv', 'utf8');
          const lines = text.split('\n');
          const H = lines[0].split(',');
          const iI = H.indexOf('article_id'), sI = H.indexOf('status');
          const want = new Set((process.env.QA_IDS || '').split(',').filter(Boolean));
          const ids = [];
          for (const l of lines.slice(1)) { if (!l.trim()) continue; const c = l.split(','); if (want.has(c[iI]) && c[sI] === 'PASS') ids.push(c[iI]); }
          console.log(ids.join(','));
          EOF
          )
          if [ -n "$PASS_IDS" ]; then
            node scripts/factory/operator.js publish --ids "$PASS_IDS" --scope fast
          else
            echo "không có hàng PASS trong lần QA này — hàng REPAIR chờ writer sửa draft rồi push lại (repair push)"
          fi

      - name: Light smoke (scoped consistency + liveness watchdog — KHÔNG full verify)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          node scripts/factory/factory.js consistency --ids "${{ steps.select.outputs.qa_ids }}"
          code=0
          node scripts/factory/liveness-watchdog.js || code=$?
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::liveness watchdog FAIL (exit $code) — factory không tiến / trạng thái bất thường"
            exit 1
          fi
          echo "liveness watchdog exit $code (0 = PASS, 2 = WARN hygiene)"

      - name: op status (dispatch, read-only)
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'status'
        run: node scripts/factory/factory.js status

      - name: op recover (dispatch)
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'recover'
        run: |
          set -eu
          node scripts/factory/operator.js recover

      - name: op diagnostics (dispatch, read-only)
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'diagnostics'
        run: |
          set -eu
          node scripts/factory/factory.js consistency
          node scripts/factory/liveness-watchdog.js || true

      - name: Verify chuẩn trên đúng trạng thái sẽ commit (fail = KHÔNG push)
        run: |
          set -eu
          git add -A
          VERIFIED_TREE=$(git write-tree)
          echo "OPERATOR_VERIFIED_TREE=$VERIFIED_TREE" >> "$GITHUB_ENV"
          echo "OPERATOR_LOCAL_VERIFY_TREE=$VERIFIED_TREE"
          node scripts/factory/operator.js verify --scope fast
          git add -A
          if [ "$(git write-tree)" != "$VERIFIED_TREE" ]; then
            echo "::error::index đổi sau verify — có output không deterministic, KHÔNG push"
            exit 1
          fi

      - name: Commit và push fast-forward (rebase phải verify lại, KHÔNG force push)
        run: |
          set -eu
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$(git write-tree)" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cây index khác cây đã verified — DỪNG, không commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "không có gì để commit"
            exit 0
          fi
          git commit -m "factory-production: ${COMMIT_LABEL:-$ACTION} (deterministic outputs of canonical tooling only)"
          if [ "$(git rev-parse HEAD^{tree})" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cây commit khác cây đã verified — DỪNG, không push"
            exit 1
          fi
          if git push; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD)"
            echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
            exit 0
          fi
          for i in 1 2; do
            echo "::warning::origin/main đổi giữa chừng (lần $i) — fetch, rebase rồi VERIFY LẠI trạng thái rebase"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict — STOP, KHÔNG force push; resume lần chạy sau từ repository truth"
              exit 1
            fi
            echo "OPERATOR_LOCAL_VERIFY_HEAD_POST_REBASE=$(git rev-parse HEAD)"
            node scripts/factory/operator.js verify --scope fast
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::trạng thái sau rebase không clean — STOP, KHÔNG push trạng thái chưa hòa giải"
              exit 1
            fi
            if git push; then
              git fetch origin main
              git merge-base --is-ancestor HEAD origin/main
              echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD) (sau rebase, đã verify lại)"
              echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
              exit 0
            fi
          done
          echo "::error::push vẫn conflict sau rebase + verify — STOP, không force push"
          exit 1

      - name: Xác nhận trạng thái sạch (txn inactive, lock sạch, checkpoint ổn)
        if: github.event_name == 'workflow_dispatch' || steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          node scripts/factory/factory.js status
