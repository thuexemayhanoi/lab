# migrate-root-pages — ONE-TIME janitor for the branch-pages migration.
# Removes the previously committed site/ intermediate in a single commit so the
# repository has exactly one public tree (repository root). Safe to run when
# site/ is already absent (no-op). This workflow will be removed after migration.
name: migrate-root-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-root-pages
  cancel-in-progress: false

jobs:
  remove-legacy-site-dir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove committed site/ intermediate (single-commit cleanup)
        run: |
          set -e
          if [ ! -d site ]; then echo "site/ already absent — nothing to do"; exit 0; fi
          git config user.name "pages-migration[bot]"
          git config user.email "actions@users.noreply.github.com"
          git rm -r -q site
          git commit -m "chore: remove committed site/ intermediate (branch root deployment is the single public tree)"
          git push
