name: test-build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble matrix + status
        run: node scripts/factory/factory.js status
      - name: Consistency check
        run: node scripts/factory/factory.js consistency
      - name: Tests
        run: node --test tests/test-suite.js
      - name: Build site
        run: node scripts/site/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
