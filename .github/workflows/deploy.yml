name: test-build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble matrix + status
        run: node scripts/factory/factory.js status
      - name: Consistency check
        run: node scripts/factory/factory.js consistency
      - name: Tests
        run: node --test tests/test-suite.js
      - name: Build site
        run: node scripts/site/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore Pages to GitHub Actions deployment (build_type=workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/pages-put.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/thuexemayhanoi/lab/pages \
            -d '{"build_type":"workflow"}')
          echo "PUT /repos/thuexemayhanoi/lab/pages -> HTTP $code"
          cat /tmp/pages-put.json 2>/dev/null || true
          if [ "$code" != "204" ] && [ "$code" != "200" ] && [ "$code" != "422" ]; then
            echo "::error::Cannot set build_type=workflow with the workflow token (HTTP $code). Pages must be switched to 'GitHub Actions' source by a repository admin (Settings -> Pages)."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
