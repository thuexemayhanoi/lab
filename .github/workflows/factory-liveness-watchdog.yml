name: Factory Liveness Watchdog

# FACTORY LIVENESS WATCHDOG — hardening F3 (Tier 4 liveness).
#
# Phát hiện trạng thái "workflow xanh nhưng factory KHÔNG tiến": stale
# draft lint (draft committed của row PUBLISHED/BLOCKED hoặc id lạ), active chunk đứng,
# active transaction quá tuổi, lock hết hạn + unfinished work, ledger
# ngừng tiến. CI/invariant xanh không chứng minh factory còn tiến —
# watchdog này là lớp kiểm đó.
#
# HỢP ĐỒNG READ-ONLY TUYỆT ĐỐI:
#   - permissions: contents: read — KHÔNG commit, KHÔNG push, KHÔNG mutate
#     production truth, KHÔNG force-clear lock/transaction, KHÔNG claim/publish.
#   - Watchdog chỉ ĐỌC repository truth (checkpoint + matrix + transaction +
#     writer-lock + throughput-ledger + committed _drafts/ files) và báo cáo.
#   - Người dùng chủ động nghỉ KHÔNG phải lỗi (HEALTHY IDLE = PASS).
#   - Watchdog SELF-CONTAINED trên canonical truth: assemble matrix
#     READ-ONLY IN-MEMORY từ shards data/content-matrix.csv.part* khi
#     thiếu assembled CSV (gitignored) — direct CLI và Actions chạy GIỐNG
#     NHAU, không cần assemble step làm dirty working tree. Critical truth
#     (checkpoint/transaction/writer-lock/throughput-ledger + matrix)
#     thiếu/hỏng => FAIL CLOSED (STATE_MISSING/STATE_INVALID), không bao
#     giờ fallback im lặng thành trạng thái lành giả.
#   - Workflow chứng minh read-only: cây sạch TRƯỚC + SAU, sha256
#     production truth byte-identical trước/sau.
#
# Exit code của scripts/factory/liveness-watchdog.js: 0=PASS, 2=WARN, 1=FAIL.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # mỗi 6 giờ

concurrency:
  group: factory-liveness-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read-only watchdog input)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cây phải sạch TRƯỚC watchdog (clean checkout contract)
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::cây đã dirty trước khi watchdog chạy — không thể chứng minh read-only"
            git status --porcelain
            exit 1
          fi
          echo "cây sạch trước watchdog (clean checkout — chỉ canonical shards, không assembled CSV)"

      - name: Fingerprint production truth (TRƯỚC watchdog)
        run: sha256sum data/state/*.json data/content-matrix.csv.part* | sort > /tmp/watchdog-truth-before.txt

      - name: Liveness watchdog (READ-ONLY, exit 0=PASS 2=WARN 1=FAIL)
        run: |
          set -eu
          code=0
          node scripts/factory/liveness-watchdog.js || code=$?
          echo "watchdog exit: $code"
          if [ "$code" = "0" ]; then
            echo "LIVENESS PASS (HEALTHY)"
          elif [ "$code" = "2" ]; then
            echo "::warning::LIVENESS WARN — chạy op recover qua kênh chuẩn khi cần (watchdog không tự clear/claim/publish)"
          else
            echo "::error::LIVENESS FAIL — factory có unfinished work đứng/command treo/tx-lock bất thường; chạy op recover qua kênh chuẩn, KHÔNG force-clear"
            exit 1
          fi

      - name: Xác nhận watchdog KHÔNG mutate cây (read-only contract)
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::watchdog làm cây đổi — vi phạm hợp đồng read-only"
            git status --porcelain
            exit 1
          fi
          echo "cây sạch — watchdog hoàn toàn read-only"

      - name: Production truth sha256 KHÔNG đổi (read-only proof)
        run: |
          set -eu
          sha256sum data/state/*.json data/content-matrix.csv.part* | sort > /tmp/watchdog-truth-after.txt
          diff /tmp/watchdog-truth-before.txt /tmp/watchdog-truth-after.txt
          echo "production truth byte-identical trước/sau watchdog"
