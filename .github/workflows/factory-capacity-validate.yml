name: Factory capacity validate

# Kiem chu mo hinh nang luc 10K cua /lab (port tu /blog factory-capacity-
# validate) — READ-ONLY: khong bao gio commit/push ve main. Ket qua chi dua
# ra log va step summary. Moi kiem dua tren repository truth (shards matrix,
# state, cay public, sitemap), khong so lieu bịa.

# SIMPLE PRODUCTION MODE: full validation (Tier 1+3 battery) chạy CHỈ khi thay
# engine/workflow/reliability files (path-filtered). Normal content publishes
# (matrix shards, data/state, data/published, data/qa, reports, public pages,
# config/content-factory.json runtime grounding ids) KHÔNG trigger workflow
# này — mỗi content push chỉ chạy đúng MỘT lightweight content validation
# (ci-validate.yml). Chạy thủ công bất cứ lúc nào qua workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/factory/**'
      - 'scripts/site/**'
      - 'tests/**'
      - 'config/article-rubric.json'
      - 'config/business-facts.json'
      - 'config/editorial.json'
      - 'config/editorial-hubs.json'
      - 'config/seo-experiment.json'
      - 'config/site.json'
      - 'config/source-policy.json'
      - '.github/workflows/factory-operator.yml'
      - '.github/workflows/factory-validate.yml'
      - '.github/workflows/factory-capacity-validate.yml'
      - '.github/workflows/factory-soak.yml'
      - '.github/workflows/factory-liveness-watchdog.yml'
      - '.github/workflows/ci-validate.yml'
      - 'AGENTS.md'
      - 'docs/PROC-PUBLISH.md'
      - 'docs/CONTENT-FACTORY.md'
      - 'docs/PROC-RECOVERY.md'
  pull_request:
    paths:
      - 'scripts/factory/**'
      - 'scripts/site/**'
      - 'tests/**'
      - 'config/article-rubric.json'
      - 'config/business-facts.json'
      - 'config/editorial.json'
      - 'config/editorial-hubs.json'
      - 'config/seo-experiment.json'
      - 'config/site.json'
      - 'config/source-policy.json'
      - '.github/workflows/factory-operator.yml'
      - '.github/workflows/factory-validate.yml'
      - '.github/workflows/factory-capacity-validate.yml'
      - '.github/workflows/factory-soak.yml'
      - '.github/workflows/factory-liveness-watchdog.yml'
      - '.github/workflows/ci-validate.yml'
      - 'AGENTS.md'
      - 'docs/PROC-PUBLISH.md'
      - 'docs/CONTENT-FACTORY.md'
      - 'docs/PROC-RECOVERY.md'
  workflow_dispatch:

permissions:
  contents: read

# Per-ref concurrency (hardening F2): nhóm tách theo ref/branch để PR
# KHÔNG thể cancel production-invariant run của main và main KHÔNG cancel
# validation của PR. Trong CÙNG một ref thì cancel-in-progress: true vẫn
# hợp lệ (chỉ tự hủy các run cũ của chính ref đó, ví dụ push liên tiếp).
# LƯU Ý: factory-operator.yml GIỮ NGUYÊN concurrency group toàn cục
# lab-factory-production + cancel-in-progress: false (serialize mọi
# production mutation) — KHÔNG được tách theo ref.
concurrency:
  group: factory-capacity-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capacity:
    name: Capacity model + state invariants (READ-ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Truth fingerprint trước kiểm (validation phải READ-ONLY thuần)
        run: sha256sum data/state/*.json data/content-matrix.csv.part* | sort > /tmp/truth-before.txt

      - name: Capacity audit (10K model vs matrix + state + sitemap + draft leak)
        run: node scripts/factory/capacity-check.js

      - name: Grounding (claim định lượng có evidence thật, READ-ONLY)
        run: node scripts/factory/factory.js grounding

      - name: "Workflow YAML safety contract (operator: single coordinator, no force push, rebase re-verify)"
        run: node --test tests/test-suite.js

      - name: Validation phải thuần READ-ONLY (working tree + truth không đổi)
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: capacity validation làm bẩn working tree"
            git status --porcelain
            exit 1
          fi
          sha256sum data/state/*.json data/content-matrix.csv.part* | sort > /tmp/truth-after.txt
          diff /tmp/truth-before.txt /tmp/truth-after.txt
          echo "OK: READ-ONLY thuần — working tree và truth sạch."

      - name: Final summary
        run: |
          {
            echo "## Factory capacity validate — PASS"
            echo "- Exactly 10,000 production rows: PASS"
            echo "- Unique article IDs / slugs / output paths / canonicals: PASS"
            echo "- Valid status values + taxonomy/geography refs: PASS"
            echo "- Checkpoint consistent with matrix truth: PASS"
            echo "- Transaction inactive + writer lock clean: PASS"
            echo "- Published files + archives exist: PASS"
            echo "- Sitemap coverage exactly-once, no non-published URL: PASS"
            echo "- No draft leak: PASS"
            echo "- Chunk max = 10, phase = PRODUCTION: PASS"
            echo "- Grounding (claim định lượng VND/%/thời gian): PASS"
            echo "- Workflow: READ-ONLY (không commit về main)"
          } >> "$GITHUB_STEP_SUMMARY"
