name: Factory Soak (Long-run / Failure recovery)

# FACTORY SOAK — hardening F4 (Tier 4: long-run + failure recovery).
#
# Multi-chunk soak test trong SANDBOX (os.tmpdir), KHÔNG đụng production
# truth: 6 chunks × 10 articles, mỗi chunk một kịch bản fault-injection có
# kiểm soát (clean, crash-after-beginTx, build-failure, editorial-audit
# failure, verify failure, stale lock + restart/recover + retry publish).
# Sau MỖI iteration: assert transaction inactive, lock free, checkpoint khớp
# matrix, contiguous prefix, exactly-once ledger publish, không duplicate
# publish, không orphan archive/page, không draft leak, deterministic
# rebuild không drift.
#
# Kết thúc soak: không stale tx/lock, không URL non-PUBLISHED trong sitemap,
# checkpoint + matrix + sitemap + search-index + knowledge-index đồng bộ.
# Tier 4 BẮT BUỘC cho mọi thay đổi engine/workflow/recovery.

# TIER 4 ENFORCEMENT (hardening session 5 — Finding 2): soak chạy trên CẢ
# pull_request lẫn push vào main (path-filtered) — direct push thay
# engine/workflow/recovery KHÔNG thể vào main mà không có Tier 4. Prose
# article changes KHÔNG trigger (chỉ những gì ảnh hưởng reliability).
# Path contract (giống nhau cho PR và push main):
#   - engine + site builder + soak suite + static regression suite;
#   - toàn bộ workflows liên quan reliability (operator/validate/capacity/
#     soak/watchdog/ci-validate);
#   - data/state/** (production truth state) + config/** (engine contract);
#   - docs contract files được pin bởi static regression tests trong
#     tests/test-suite.js (AGENTS.md, PROC-PUBLISH, CONTENT-FACTORY, PROC-RECOVERY).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # hàng tuần, thứ Hai 03:00 UTC
  pull_request:
    paths:
      - 'scripts/factory/**'
      - 'scripts/site/**'
      - 'tests/soak/**'
      - 'tests/test-suite.js'
      - '.github/workflows/factory-operator.yml'
      - '.github/workflows/factory-validate.yml'
      - '.github/workflows/factory-capacity-validate.yml'
      - '.github/workflows/factory-soak.yml'
      - '.github/workflows/factory-liveness-watchdog.yml'
      - '.github/workflows/ci-validate.yml'
      - 'data/state/**'
      - 'config/**'
      - 'AGENTS.md'
      - 'docs/PROC-PUBLISH.md'
      - 'docs/CONTENT-FACTORY.md'
      - 'docs/PROC-RECOVERY.md'
  push:
    branches: [main]
    paths:
      - 'scripts/factory/**'
      - 'scripts/site/**'
      - 'tests/soak/**'
      - 'tests/test-suite.js'
      - '.github/workflows/factory-operator.yml'
      - '.github/workflows/factory-validate.yml'
      - '.github/workflows/factory-capacity-validate.yml'
      - '.github/workflows/factory-soak.yml'
      - '.github/workflows/factory-liveness-watchdog.yml'
      - '.github/workflows/ci-validate.yml'
      - 'data/state/**'
      - 'config/**'
      - 'AGENTS.md'
      - 'docs/PROC-PUBLISH.md'
      - 'docs/CONTENT-FACTORY.md'
      - 'docs/PROC-RECOVERY.md'

concurrency:
  # PER-REF: PR không cancel soak run của main, main không cancel PR;
  # cancel-in-progress chỉ trong CÙNG ref (chạy lại liên tiếp trên 1 branch).
  # KHÔNG đụng global production mutation group lab-factory-production.
  group: factory-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble matrix + status (gitignored csv từ canonical shards — như ci-validate)
        run: node scripts/factory/factory.js status

      - name: Soak test (sandbox — không đụng production truth)
        run: node --test tests/soak/factory-soak.js
